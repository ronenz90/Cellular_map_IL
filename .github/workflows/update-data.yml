name: עדכון נתוני אנטנות

on:
  schedule:
    # פעם ביום ב-03:00 UTC (כ-06:00 שעון ישראל). המקור הממשלתי מתעדכן
    # לרוב לא יותר מפעם בשבוע-חודש, כך שתדירות יומית מספיקה בהחלט
    # ואינה מעמיסה על data.gov.il.
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # מאפשר הרצה ידנית מטאב Actions בגיטהאב

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: הרצת סקריפט השליפה
        run: python3 scripts/fetch_data.py

      - name: קומיט ופוש אם יש שינויים
        run: |
          git config user.name "antenna-data-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "אין שינויים בנתונים"
            exit 0
          fi
          git commit -m "עדכון אוטומטי לנתוני אנטנות $(date -u +'%Y-%m-%d')"

          # אם בינתיים נדחף commit אחר ל-main (למשל ה-precompute הלילי
          # הארוך שעדיין רץ) - מושכים ומנסים שוב במקום לאבד את השליפה
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✓ נדחף בהצלחה (ניסיון $attempt)"
              exit 0
            fi
            echo "⚠️ push נדחה (ניסיון $attempt) - מושכים עם rebase ומנסים שוב..."
            git fetch origin main
            git rebase origin/main
          done

          echo "❌ נכשל לדחוף אחרי 5 ניסיונות"
          exit 1
