name: בניית APK לאנדרואיד

on:
  workflow_dispatch: {}     # הפעלה ידנית מטאב Actions
  push:
    tags:
      - 'v*'                 # הפעלה אוטומטית כשיוצרים טאג גרסה, למשל v1.0.0

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: התקנת תלויות
        run: npm install

      - name: הכנת תיקיית www
        run: bash scripts/prepare-www.sh

      - name: הוספת פלטפורמת אנדרואיד (אם עוד לא קיימת)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: ודא שהרשאות מיקום קיימות ב-Manifest (רשת ביטחון)
        # לא סומכים רק על המיזוג האוטומטי של @capacitor/geolocation -
        # מוודאים במפורש שההרשאות קיימות, ומדפיסים ללוג לאימות.
        run: |
          python3 - <<'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, encoding="utf-8") as f:
              content = f.read()
          perms = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
          ]
          for perm in perms:
              name = perm.split('"')[1]
              if name not in content:
                  content = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + perm, content, count=1)
                  print(f"נוספה הרשאה: {name}")
              else:
                  print(f"הרשאה כבר קיימת: {name}")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF
          echo "--- תוכן ההרשאות הסופי ב-Manifest ---"
          grep -i "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: בניית APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: העלאת ה-APK כ-artifact להורדה
        uses: actions/upload-artifact@v4
        with:
          name: antenna-map-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: הפיכת פרויקט Android Studio לעצמאי (vendoring תלויות Capacitor)
        # ההפניות היחסיות ל-../node_modules/@capacitor/... לא תמיד יושבות
        # ב-settings.gradle עצמו - קפסיטור מפריד אותן ל-קובץ נפרד
        # capacitor.settings.gradle שנטען דרך "apply from:". בודקים את שני
        # הקבצים (כל מה שקיים מהם) כדי לא לפספס, כי אם מטפלים רק ב-
        # settings.gradle כשההפניות בפועל ב-capacitor.settings.gradle -
        # הסקריפט "מצליח" בלי לשנות כלום, וה-node_modules החיצוני עדיין חסר.
        run: |
          python3 - <<'PYEOF'
          import re, shutil, os

          candidate_files = ["android/settings.gradle", "android/capacitor.settings.gradle"]
          pattern = re.compile(r"project\(':([\w-]+)'\)\.projectDir\s*=\s*new File\('([^']+)'\)")
          vendor_root = "android/capacitor-libs"
          os.makedirs(vendor_root, exist_ok=True)
          total_replacements = 0

          def make_replacer():
              def replace(match):
                  global total_replacements
                  name, rel_path = match.group(1), match.group(2)
                  if "node_modules" not in rel_path:
                      return match.group(0)  # כבר עצמאי (למשל capacitor-cordova-android-plugins) - לא נוגעים
                  src = os.path.normpath(os.path.join("android", rel_path))
                  dst = os.path.join(vendor_root, name)
                  if os.path.isdir(src) and not os.path.isdir(dst):
                      shutil.copytree(src, dst)
                      print(f"הועתק: {src} -> {dst}")
                  elif not os.path.isdir(src):
                      print(f"אזהרה: {src} לא נמצא, לא ניתן לבצע vendoring ל-{name}")
                  total_replacements += 1
                  return f"project(':{name}').projectDir = new File('capacitor-libs/{name}')"
              return replace

          for path in candidate_files:
              if not os.path.exists(path):
                  print(f"{path} לא קיים בפרויקט הזה - מדלגים")
                  continue
              with open(path, encoding="utf-8") as f:
                  content = f.read()
              new_content = pattern.sub(make_replacer(), content)
              if new_content != content:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"--- {path} עודכן ---")
                  print(new_content)
              else:
                  print(f"{path} - לא נמצאו הפניות node_modules לטפל בהן")

          if total_replacements == 0:
              print("⚠️ אזהרה: אף הפניה לא טופלה בשום קובץ - ייתכן ש-cap sync שינה מבנה, "
                    "בדקו ידנית את settings.gradle ו-capacitor.settings.gradle")
          PYEOF

      - name: ניקוי תיקיות build/cache כבדות מהפרויקט
        # מאפשר לפתוח את הפרויקט ישירות ב-Android Studio (או בכלים
        # חיצוניים לבניית APK) ולבנות/לחתום APK משלכם, בלי תלות ב-CI.
        # מנקים תיקיות build/cache כבדות שנוצרות מחדש אוטומטית בפתיחה
        # הראשונה.
        #
        # חשוב - למה *לא* יוצרים zip בעצמנו כאן: actions/upload-artifact
        # תמיד עוטף את מה שמעלים ב-zip נוסף בזמן ההורדה מהאתר. אם
        # מעלים zip שכבר יצרנו, ה-zip שמתקבל בהורדה מכיל בתוכו את ה-zip
        # שלנו כקובץ בודד (zip-בתוך-zip) - בדיוק מה שגרם ל"Invalid
        # Android project" בכלי החיצוני (הוא ראה קובץ zip יחיד, לא
        # build.gradle/app/ בשורש). הפתרון: מעלים את *התיקייה* עצמה
        # כ-artifact - כשמעלים תיקייה בודדת, ה-zip שנוצר בהורדה מכיל
        # את התוכן שלה ישירות בשורש, בלי עטיפה נוספת.
        run: |
          rm -rf android/app/build android/.gradle android/build android/.idea
          rm -f android/local.properties  # נתיב SDK ספציפי ל-runner, Android Studio ייצור מחדש
          echo "--- תוכן תיקיית android/ שתועלה (לוודא build.gradle ו-app/ קיימים) ---"
          ls -la android/

      - name: העלאת פרויקט Android Studio כ-artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-studio-project
          path: android
