name: בניית APK לאנדרואיד

on:
  workflow_dispatch: {}     # הפעלה ידנית מטאב Actions
  push:
    tags:
      - 'v*'                 # הפעלה אוטומטית כשיוצרים טאג גרסה, למשל v1.0.0

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: התקנת תלויות
        run: npm install

      - name: הכנת תיקיית www
        run: bash scripts/prepare-www.sh

      - name: הוספת פלטפורמת אנדרואיד (אם עוד לא קיימת)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: בניית APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: העלאת ה-APK כ-artifact להורדה
        uses: actions/upload-artifact@v4
        with:
          name: antenna-map-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
