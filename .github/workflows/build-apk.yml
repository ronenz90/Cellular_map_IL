name: בניית APK לאנדרואיד

on:
  workflow_dispatch: {}     # הפעלה ידנית מטאב Actions
  push:
    tags:
      - 'v*'                 # הפעלה אוטומטית כשיוצרים טאג גרסה, למשל v1.0.0

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: התקנת תלויות
        run: npm install

      - name: הכנת תיקיית www
        run: bash scripts/prepare-www.sh

      - name: הוספת פלטפורמת אנדרואיד (אם עוד לא קיימת)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: ודא שהרשאות מיקום קיימות ב-Manifest (רשת ביטחון)
        # לא סומכים רק על המיזוג האוטומטי של @capacitor/geolocation -
        # מוודאים במפורש שההרשאות קיימות, ומדפיסים ללוג לאימות.
        run: |
          python3 - <<'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, encoding="utf-8") as f:
              content = f.read()
          perms = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
          ]
          for perm in perms:
              name = perm.split('"')[1]
              if name not in content:
                  content = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + perm, content, count=1)
                  print(f"נוספה הרשאה: {name}")
              else:
                  print(f"הרשאה כבר קיימת: {name}")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF
          echo "--- תוכן ההרשאות הסופי ב-Manifest ---"
          grep -i "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: בניית APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: העלאת ה-APK כ-artifact להורדה
        uses: actions/upload-artifact@v4
        with:
          name: antenna-map-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: הכנת zip של פרויקט Android Studio העצמאי
        # מאפשר לפתוח את הפרויקט ישירות ב-Android Studio (או בכלים
        # חיצוניים לבניית APK) ולבנות/לחתום APK משלכם, בלי תלות ב-CI.
        # מנקים תיקיות build/cache כבדות שנוצרות מחדש אוטומטית בפתיחה
        # הראשונה. חשוב: הארכיון ארוז כך ש-build.gradle ותיקיית app/
        # נמצאים **בשורש** ה-zip עצמו (לא בתוך תיקיית android/ מקוננת) -
        # זו הציפייה הסטנדרטית הן של Android Studio (פותחים תיקייה עם
        # settings.gradle בשורש) והן של כלי בנייה חיצוניים.
        run: |
          rm -rf android/app/build android/.gradle android/build android/.idea
          rm -f android/local.properties  # נתיב SDK ספציפי ל-runner, Android Studio ייצור מחדש
          cd android
          zip -r ../android-studio-project.zip . -x ".git/*"
          cd ..
          echo "--- תוכן שורש ה-zip (לוודא build.gradle ו-app/ בשורש) ---"
          unzip -l android-studio-project.zip | head -20

      - name: העלאת פרויקט Android Studio כ-artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-studio-project
          path: android-studio-project.zip
