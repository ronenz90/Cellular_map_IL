name: חישוב מקדים לכיסוי (תבליט+תכסית)

on:
  workflow_dispatch:
    inputs:
      max_hours:
        description: 'תקציב זמן ריצה בשעות (ברירת מחדל 2, ידני בלבד - אפשר לדרוס)'
        required: false
        default: '2'
      force:
        description: 'להריץ גם אם המחזור האחרון עדיין "טרי" (כן/לא)'
        required: false
        default: 'false'
  schedule:
    # פעם בכל 3 ימים, 01:00 UTC (כ-04:00 שעון ישראל). תבליט/תכסית כמעט
    # ולא משתנים, אז אין צורך לרוץ כל לילה - זה היה הגורם המרכזי לצריכת
    # Actions minutes גבוהה (עד 5 שעות * 30 לילות = עד 150 שעות/חודש).
    # בנוסף יש בדיקת "טריות" בתוך הסקריפט שמדלגת על ריצה שלמה אם מחזור
    # מלא כבר הושלם לאחרונה - כך שבפועל ירוץ בפועל לעומק רק כשצריך.
    - cron: '0 1 */3 * *'

permissions:
  contents: write

concurrency:
  group: precompute-coverage
  cancel-in-progress: false  # לא לבטל ריצה באמצע - זה job איטי ויקר, עדיף לתת לו לסיים

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 140  # מרווח ביטחון מעל לתקציב הפנימי של 2 שעות
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: הרצת חישוב מקדים (איטי, מכבד rate limits)
        env:
          # חישוב השניות נעשה כאן ב-shell/Python ולא בתוך ${{ }} - ל-GitHub
          # Actions expressions אין אופרטור כפל (*), וניסיון להשתמש בו
          # (כמו שהיה כאן בטעות בעדכון קודם) גורם ל"Invalid workflow file"
          # וכשל מיידי של הריצה, עוד לפני שה-job בכלל מתחיל.
          MAX_HOURS: ${{ github.event.inputs.max_hours || '2' }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: |
          export MAX_RUNTIME_SECONDS=$(python3 -c "print(int(float('$MAX_HOURS') * 3600))")
          python3 scripts/precompute_coverage.py

      - name: קומיט ופוש של תוצאות הלילה
        run: |
          git config user.name "antenna-coverage-bot"
          git config user.email "actions@github.com"
          git add data/coverage/ data/coverage-precompute-state.json
          if git diff --cached --quiet; then
            echo "אין קבצי כיסוי חדשים"
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | grep -c '^data/coverage/' || true)
          git commit -m "חישוב מקדים לילי לכיסוי: כ-$COUNT קבצים עודכנו"

          # הריצה הזו לוקחת עד כמה שעות - אם בינתיים נדחף commit אחר
          # ל-main (למשל עדכון האנטנות היומי), ה-push הרגיל יידחה כי
          # זה כבר לא fast-forward. במקום לאבד את כל העבודה, מושכים
          # (rebase) את השינויים המרוחקים ומנסים שוב, עד 5 פעמים.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✓ נדחף בהצלחה (ניסיון $attempt)"
              exit 0
            fi
            echo "⚠️ push נדחה (ניסיון $attempt) - כנראה יש commit חדש יותר ב-main. מושכים עם rebase ומנסים שוב..."
            git fetch origin main
            git rebase origin/main
          done

          echo "❌ נכשל לדחוף אחרי 5 ניסיונות"
          exit 1
